{% extends 'layouts/base.html' %}

{% block title %}Access Denied — {{ setting('site_name') }}{% endblock %}

{% block body %}
<div class="auth-wrap">
  <div class="auth-card text-center">
    <div class="auth-logo"><i class="fa-solid fa-shield-halved"></i></div>
    <h1 class="display-3 fw-bold text-danger">403</h1>
    <h4 class="mb-2">Access Denied</h4>
    <p class="muted">You do not have permission to view this page.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary mt-3"><i class="fa-solid fa-house me-1"></i>Back to Home</a>
  </div>
</div>
{% endblock %}
