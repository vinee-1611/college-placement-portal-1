{% extends 'layouts/base.html' %}

{% block title %}Page Not Found — {{ setting('site_name') }}{% endblock %}

{% block body %}
<div class="auth-wrap">
  <div class="auth-card text-center">
    <div class="auth-logo"><i class="fa-solid fa-magnifying-glass"></i></div>
    <h1 class="display-3 fw-bold text-primary">404</h1>
    <h4 class="mb-2">Page Not Found</h4>
    <p class="muted">The page you are looking for does not exist or has been moved.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary mt-3"><i class="fa-solid fa-house me-1"></i>Back to Home</a>
  </div>
</div>
{% endblock %}
