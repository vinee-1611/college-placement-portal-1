{% extends 'layouts/base.html' %}

{% block title %}Server Error — {{ setting('site_name') }}{% endblock %}

{% block body %}
<div class="auth-wrap">
  <div class="auth-card text-center">
    <div class="auth-logo"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <h1 class="display-3 fw-bold text-danger">500</h1>
    <h4 class="mb-2">Something Went Wrong</h4>
    <p class="muted">An unexpected error occurred. Please try again in a moment.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary mt-3"><i class="fa-solid fa-house me-1"></i>Back to Home</a>
  </div>
</div>
{% endblock %}
