{% extends 'layouts/base.html' %}

{% block title %}Reset Password — {{ setting('site_name') }}{% endblock %}

{% block body %}
<div class="auth-wrap">
  <div class="auth-card fade-in-up">
    <div class="auth-logo"><i class="fa-solid fa-lock-open"></i></div>
    <h3 class="text-center mb-1">Reset Password</h3>
    <p class="text-center muted mb-4">Choose a new strong password</p>

    {% include 'layouts/_alerts.html' %}

    <form method="post" action="{{ url_for('auth.reset_password', token=token) }}">
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" name="password" class="form-control" required>
        <div class="form-text">Min 8 chars with upper, lower, digit &amp; symbol.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-icon justify-content-center">
        <i class="fa-solid fa-lock"></i> Reset Password
      </button>
    </form>

    <div class="text-center small mt-3">
      <a href="{{ url_for('auth.login') }}">Back to login</a>
    </div>
  </div>
</div>
{% endblock %}
