{% extends 'layouts/dashboard_base.html' %}

{% block title %}Change Password — {{ setting('site_name') }}{% endblock %}
{% block page_heading %}Change Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card fade-in-up">
      <div class="card-header"><i class="fa-solid fa-key me-2"></i>Change Password</div>
      <div class="card-body">
        <form method="post" action="{{ url_for('auth.change_password') }}">
          <div class="mb-3">
            <label class="form-label">Current Password</label>
            <input type="password" name="current_password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" name="new_password" class="form-control" required>
            <div class="form-text">Min 8 chars with upper, lower, digit &amp; symbol.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm New Password</label>
            <input type="password" name="confirm_password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary btn-icon">
            <i class="fa-solid fa-floppy-disk"></i> Update Password
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
