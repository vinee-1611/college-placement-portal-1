{% if pagination and pagination.pages > 1 %}
<nav aria-label="Page navigation">
  <ul class="pagination justify-content-center mt-4">
    {% set args = request.args.to_dict() %}
    <li class="page-item {{ 'disabled' if not pagination.has_prev }}">
      <a class="page-link" href="{{ url_for(request.endpoint, page=pagination.prev_num, **args) if pagination.has_prev else '#' }}">&laquo;</a>
    </li>
    {% for p in pagination.iter_pages(left_edge=1, right_edge=1, left_current=2, right_current=2) %}
      {% if p %}
        <li class="page-item {{ 'active' if p == pagination.page }}">
          <a class="page-link" href="{{ url_for(request.endpoint, page=p, **args) }}">{{ p }}</a>
        </li>
      {% else %}
        <li class="page-item disabled"><span class="page-link">&hellip;</span></li>
      {% endif %}
    {% endfor %}
    <li class="page-item {{ 'disabled' if not pagination.has_next }}">
      <a class="page-link" href="{{ url_for(request.endpoint, page=pagination.next_num, **args) if pagination.has_next else '#' }}">&raquo;</a>
    </li>
  </ul>
</nav>
{% endif %}
